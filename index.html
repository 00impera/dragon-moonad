    import { createAppKit } from 'https://esm.sh/@reown/appkit@1.7.7'
    import { EthersAdapter } from 'https://esm.sh/@reown/appkit-adapter-ethers@1.7.7'
    const monad = {
      id: 143, name: 'Monad Mainnet', network: 'monad',
      nativeCurrency: { name: 'MON', symbol: 'MON', decimals: 18 },
      rpcUrls: { default: { http: ['https://rpc.monad.xyz'] } },
      blockExplorers: { default: { name: 'Explorer', url: 'https://explorer.monad.xyz' } }
    }
    const projectId = '83764e5a442fd38d9827e3302a37517a'
    const ethersAdapter = new EthersAdapter()
    try {
      window.appKit = createAppKit({
        adapters: [ethersAdapter], projectId, networks: [monad], defaultNetwork: monad,
        metadata: {
          name: 'Euro Voucher System', description: 'NFT Euro Vouchers on Monad Blockchain',
          url: 'https://00impera.github.io/NFT-Euro-Voucher-System-CRIPTO/',
          icons: ['https://scarlet-central-krill-672.mypinata.cloud/ipfs/bafybeiaho7h7ysvoxmoqvi7rveh2rcls6rh4weagezoi6umctfpgrgkvp4']
        },
        features: { analytics: true, email: false, socials: false }
      })
      window.appKit.subscribeAccount((account) => {
        if (account.isConnected && account.address) {
          window.wcAddress = account.address
          if (window.onWalletConnect) window.onWalletConnect(account.address)
        } else {
          window.wcAddress = null
          if (window.onWalletDisconnect) window.onWalletDisconnect()
        }
      })
    } catch(e) { console.warn('AppKit init error:', e) }

  // ── State ──────────────────────────────────────────────────
  let web3 = null, contract = null, userAddress = null, selectedVoucher = null;

  // ── DOM refs ───────────────────────────────────────────────
  const $walletButtons  = document.getElementById('walletButtons');
  const $connectedWallet= document.getElementById('connectedWallet');
  const $walletAddress  = document.getElementById('walletAddress');
  const $walletType     = document.getElementById('walletType');
  const $purchaseBtn    = document.getElementById('purchaseBtn');
  const $statusMessage  = document.getElementById('statusMessage');
  const $statusText     = document.getElementById('statusText');
  const $voucherResult  = document.getElementById('voucherResult');
  const $wcBtn          = document.getElementById('wcBtn');

  // ── Enable WalletConnect button when AppKit ready ──────────
  (function pollAppKit() {
    if (window.appKit) {
      $wcBtn.disabled = false;
      $wcBtn.style.background = 'rgba(0,180,120,0.15)';
      $wcBtn.style.borderColor = 'rgba(0,180,120,0.5)';
      $wcBtn.style.color = '#34d399';
      $wcBtn.style.opacity = '1';
      $wcBtn.innerHTML = '📱 WalletConnect — Mobile & 300+ Wallets';
    } else {
      setTimeout(pollAppKit, 200);
    }
  })();

  // ── Switch/Add Monad network helper ───────────────────────
  async function ensureMonad(provider) {
    const chainHex = await provider.request({ method: 'eth_chainId' });
    if (parseInt(chainHex, 16) === MONAD_CHAIN_ID_DEC) return true; // already on Monad

    showStatus('⚠️ Switching to Monad network...');
    try {
      await provider.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: MONAD_CHAIN_ID_HEX }] });
      await new Promise(r => setTimeout(r, 800));
      return true;
    } catch (err) {
      // 4902 = chain not added yet; -32603 = some wallets use this instead
      if (err.code === 4902 || err.code === -32603 || err.message?.includes('Unrecognized chain')) {
        try {
          await provider.request({ method: 'wallet_addEthereumChain', params: [MONAD_NETWORK_PARAMS] });
          await new Promise(r => setTimeout(r, 800));
          return true;
        } catch (addErr) {
          showStatus('❌ Could not add Monad network: ' + (addErr.message || addErr));
          return false;
        }
      }
      if (err.code === 4001) { showStatus('❌ Network switch rejected by user'); return false; }
      // Some wallets throw on switchEthereumChain even if they added it — try adding anyway
      try {
        await provider.request({ method: 'wallet_addEthereumChain', params: [MONAD_NETWORK_PARAMS] });
        await new Promise(r => setTimeout(r, 800));
        return true;
      } catch (_) {
        showStatus('❌ Failed to switch network: ' + (err.message || err));
        return false;
      }
    }
  }

  // ── Finish connection after provider is ready ──────────────
  function finishConnect(provider, label) {
    web3     = new Web3(provider);
    contract = new web3.eth.Contract(CONTRACT_ABI, CONTRACT_ADDRESS);
    $walletAddress.textContent = userAddress.slice(0,8) + '...' + userAddress.slice(-6);
    $walletType.textContent    = label;
    $walletButtons.style.display  = 'none';
    $connectedWallet.style.display = 'block';
    $statusMessage.classList.add('hidden');
    updatePurchaseBtn();

    provider.on?.('accountsChanged', accs => {
      if (!accs.length) disconnectWallet();
      else { userAddress = accs[0]; $walletAddress.textContent = userAddress.slice(0,8)+'...'+userAddress.slice(-6); }
    });
    provider.on?.('chainChanged', () => location.reload());
  }

  // ── Connect injected wallets (MetaMask/Rabby/Coinbase/Any) ─
  async function connectInjected(type) {
    // Find the right provider
    let provider = null;
    const eth = window.ethereum;

    if (!eth) {
      const links = {
        metamask: 'https://metamask.io/download.html',
        rabby:    'https://rabby.io',
        coinbase: 'https://www.coinbase.com/wallet/downloads'
      };
      const url = links[type] || 'https://metamask.io/download.html';
      showStatus(`⚠️ No wallet found. <a href="${url}" target="_blank" class="underline text-blue-300">Install a wallet</a> and refresh.`);
      return;
    }

    // Multi-provider array (some browsers expose multiple wallets)
    const providers = eth.providers || [eth];

    if (type === 'metamask') {
      provider = providers.find(p => p.isMetaMask && !p.isRabby) || (eth.isMetaMask ? eth : null);
    } else if (type === 'rabby') {
      provider = providers.find(p => p.isRabby) || (eth.isRabby ? eth : null) || eth;
    } else if (type === 'coinbase') {
      provider = window.coinbaseWalletExtension
              || providers.find(p => p.isCoinbaseWallet)
              || (eth.isCoinbaseWallet ? eth : null);
      if (!provider) { showStatus('⚠️ Coinbase Wallet not found. <a href="https://www.coinbase.com/wallet/downloads" target="_blank" class="underline text-blue-300">Install here</a>'); return; }
    } else {
      provider = eth; // any injected
    }

    if (!provider) { provider = eth; } // final fallback

    try {
      showStatus('🔄 Connecting...');
      const accounts = await provider.request({ method: 'eth_requestAccounts' });
      if (!accounts?.length) { showStatus('❌ No accounts returned'); return; }
      userAddress = accounts[0];

      const ok = await ensureMonad(provider);
      if (!ok) return;

      const labels = { metamask:'🦊 MetaMask', rabby:'🐰 Rabby', coinbase:'🔵 Coinbase', any:'🔗 Wallet' };
      finishConnect(provider, labels[type] || '🔗 Wallet');

    } catch (err) {
      if (err.code === 4001) showStatus('❌ Connection rejected');
      else showStatus('❌ ' + (err.message || 'Connection failed'));
    }
  }

  // ── Connect via WalletConnect / AppKit ─────────────────────
  async function connectWC() {
    if (!window.appKit) { showStatus('⚠️ WalletConnect not ready yet, please wait...'); return; }
    try {
      showStatus('🔄 Opening WalletConnect...');
      await window.appKit.open();

      window.onWalletConnect = async (address) => {
        userAddress = address;
        const wcProv = window.appKit.getWalletProvider?.() || null;
        if (wcProv) {
          web3 = new Web3(wcProv);
        } else {
          web3 = new Web3(new Web3.providers.HttpProvider(MONAD_RPC));
        }
        contract = new web3.eth.Contract(CONTRACT_ABI, CONTRACT_ADDRESS);
        $walletAddress.textContent = address.slice(0,8)+'...'+address.slice(-6);
        $walletType.textContent    = '📱 WalletConnect';
        $walletButtons.style.display   = 'none';
        $connectedWallet.style.display = 'block';
        $statusMessage.classList.add('hidden');
        updatePurchaseBtn();
      };
      window.onWalletDisconnect = () => disconnectWallet();

    } catch (err) {
      showStatus('❌ WalletConnect error: ' + (err.message || err));
    }
  }

  // ── Disconnect ─────────────────────────────────────────────
  function disconnectWallet() {
    web3 = null; contract = null; userAddress = null; selectedVoucher = null;
    $walletButtons.style.display   = 'grid';
    $connectedWallet.style.display = 'none';
    document.querySelectorAll('.voucher-btn').forEach(b => b.classList.remove('selected'));
    updatePurchaseBtn();
    showStatus('Wallet disconnected.');
  }
  document.getElementById('disconnectBtn').addEventListener('click', disconnectWallet);

  // ── Voucher selection ──────────────────────────────────────
  document.querySelectorAll('.voucher-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!userAddress) { showStatus('⚠️ Please connect wallet first'); return; }
      document.querySelectorAll('.voucher-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedVoucher = { value: parseInt(btn.dataset.value), price: btn.dataset.price };
      updatePurchaseBtn();
    });
  });

  function updatePurchaseBtn() {
    if (selectedVoucher && userAddress) {
      $purchaseBtn.disabled = false;
      $purchaseBtn.textContent = `BUY ${selectedVoucher.value}€ FOR ${selectedVoucher.price} MON`;
    } else {
      $purchaseBtn.disabled = true;
      $purchaseBtn.textContent = 'SELECT VOUCHER';
    }
  }

  // ── Purchase voucher ───────────────────────────────────────
  $purchaseBtn.addEventListener('click', async () => {
    if (!selectedVoucher || !userAddress || !contract) return;
    try {
      const voucherId = `VOC-${Date.now()}-${Math.random().toString(36).substr(2,9).toUpperCase()}`;
      showStatus('💳 Confirm transaction in your wallet...');
      const tx = await contract.methods.purchaseVoucher(selectedVoucher.value, voucherId)
        .send({ from: userAddress, value: web3.utils.toWei(selectedVoucher.price, 'ether') });
      let tokenId = tx.events?.VoucherPurchased?.returnValues?.tokenId
                 || (tx.logs?.[0]?.topics?.[1] ? parseInt(tx.logs[0].topics[1], 16) : '?');
      showStatus(`✅ Voucher #${tokenId} minted! TX: ${tx.transactionHash.slice(0,10)}...`);
      document.querySelectorAll('.voucher-btn').forEach(b => b.classList.remove('selected'));
      selectedVoucher = null; updatePurchaseBtn();
    } catch (err) {
      if (err.code === 4001) showStatus('❌ Transaction rejected');
      else showStatus('❌ Transaction failed: ' + (err.message || err));
    }
  });

  // ── Read Gift ID ───────────────────────────────────────────
  document.getElementById('readVoucherBtn').addEventListener('click', async () => {
    const tokenId = document.getElementById('readTokenId').value;
    $voucherResult.textContent = '';
    if (!tokenId || isNaN(tokenId)) { $voucherResult.textContent = 'Please enter a valid tokenId.'; return; }
    if (!contract) { $voucherResult.textContent = '⚠️ Please connect wallet first.'; return; }
    try {
      $voucherResult.textContent = 'Loading...';
      const r = await contract.methods.getVoucher(tokenId).call();
      $voucherResult.innerHTML = `
        <div class="space-y-1">
          <div><b>Euro Value:</b> ${r[0]}€</div>
          <div><b>Price Paid:</b> ${web3.utils.fromWei(r[1],'ether')} MON</div>
          <div><b>Buyer:</b> ${r[2]}</div>
          <div><b>Purchase Time:</b> ${new Date(Number(r[3])*1000).toLocaleString()}</div>
          <div><b>Redeemed:</b> ${r[4] ? 'Yes ✓' : 'No ✗'}</div>
          <div><b>Voucher ID:</b> ${r[5]}</div>
        </div>`;
    } catch (err) { $voucherResult.textContent = 'Error: ' + (err.message || 'Token may not exist'); }
  });

  // ── Status helper ──────────────────────────────────────────
  function showStatus(msg) {
    $statusText.innerHTML = msg;
    $statusMessage.classList.remove('hidden');
  }
</script>
</body>
